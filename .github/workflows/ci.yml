name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Unit, pipeline, and CLI tests on a fixture repo generated by the tests. Scripted agents only: no API key, no network.
      - run: npm test

  sqlparse-demo:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1
      - run: npm ci
      - run: npm run build
      # Mines sqlparse's history at a pinned commit, validates every candidate, and fails if the
      # oracle misses any task or the no-op agent solves one. No model is called.
      - name: Build and calibrate a benchmark from sqlparse
        run: node examples/sqlparse/run-demo.mjs "${{ runner.temp }}/demo" --jobs 4
      - name: Add the report to the job summary
        if: always()
        shell: bash
        run: cat "${{ runner.temp }}/demo/bench/runs/demo/report.md" >> "$GITHUB_STEP_SUMMARY" || true
